
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Festival 2027</title>
</head>
<body>
    <main>
        <h1>Iniciar sesión</h1>

        {% if form.errors %}
            <p>El usuario o la contraseña no son correctos. Inténtalo de nuevo.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Ingresar</button>
        </form>

        <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
        <a href="/">Volver al inicio</a>
    </main>
</body>
</html>
